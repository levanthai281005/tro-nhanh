name: tro-nhanh-fe

x-dev-service: &dev-service
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /workspace
  init: true
  stdin_open: true
  tty: true
  volumes:
    - .:/workspace
    - root_node_modules:/workspace/node_modules
    - web_node_modules:/workspace/apps/web/node_modules
    - mobile_node_modules:/workspace/apps/mobile/node_modules
    - api_app_node_modules:/workspace/apps/api/node_modules
    - access_node_modules:/workspace/packages/access/node_modules
    - api_node_modules:/workspace/packages/api/node_modules
    - config_node_modules:/workspace/packages/config/node_modules
    - constants_node_modules:/workspace/packages/constants/node_modules
    - schemas_node_modules:/workspace/packages/schemas/node_modules
    - utils_node_modules:/workspace/packages/utils/node_modules
    - turbo_cache:/workspace/.turbo
  environment: &dev-environment
    CI: 'false'
    CHOKIDAR_USEPOLLING: 'true'
    WATCHPACK_POLLING: 'true'
    REACT_NATIVE_PACKAGER_HOSTNAME: '${EXPO_HOST_IP:-localhost}'

services:
  web:
    <<: *dev-service
    command: pnpm --filter web dev --hostname 0.0.0.0
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - mobile_node_modules:/workspace/apps/mobile/node_modules
      - api_app_node_modules:/workspace/apps/api/node_modules
      - access_node_modules:/workspace/packages/access/node_modules
      - api_node_modules:/workspace/packages/api/node_modules
      - config_node_modules:/workspace/packages/config/node_modules
      - constants_node_modules:/workspace/packages/constants/node_modules
      - schemas_node_modules:/workspace/packages/schemas/node_modules
      - utils_node_modules:/workspace/packages/utils/node_modules
      - turbo_cache:/workspace/.turbo
      - next_cache:/workspace/apps/web/.next

  mobile:
    <<: *dev-service
    profiles: [mobile]
    command: pnpm --filter mobile start -- --host lan --port 8081
    ports:
      - '8081:8081'
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - mobile_node_modules:/workspace/apps/mobile/node_modules
      - api_app_node_modules:/workspace/apps/api/node_modules
      - access_node_modules:/workspace/packages/access/node_modules
      - api_node_modules:/workspace/packages/api/node_modules
      - config_node_modules:/workspace/packages/config/node_modules
      - constants_node_modules:/workspace/packages/constants/node_modules
      - schemas_node_modules:/workspace/packages/schemas/node_modules
      - utils_node_modules:/workspace/packages/utils/node_modules
      - turbo_cache:/workspace/.turbo
      - expo_cache:/workspace/apps/mobile/.expo

  # Backend NestJS. Chuỗi kết nối trỏ vào service `postgres` bên dưới, đè giá trị trong
  # `apps/api/.env` (dotenv không ghi đè biến đã có).
  api:
    <<: *dev-service
    command: pnpm dev:api
    ports:
      - '8089:8089'
    environment:
      <<: *dev-environment
      DATABASE_URL: postgresql://tronhanh:tronhanh@postgres:5432/tronhanh
      DIRECT_URL: postgresql://tronhanh:tronhanh@postgres:5432/tronhanh
    depends_on:
      postgres:
        condition: service_healthy

  # Cơ sở dữ liệu cho máy dev: `prisma migrate dev` cần tạo shadow database, việc Supabase không
  # cho làm. Migration viết ở đây, áp lên Supabase bằng `prisma migrate deploy`.
  # Giữ cùng major với project Supabase để hành vi SQL không lệch.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tronhanh
      POSTGRES_PASSWORD: tronhanh
      POSTGRES_DB: tronhanh
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tronhanh -d tronhanh']
      interval: 5s
      timeout: 5s
      retries: 10

  tools:
    <<: *dev-service
    profiles: [tools]
    command: pnpm lint

volumes:
  root_node_modules:
  web_node_modules:
  mobile_node_modules:
  api_app_node_modules:
  access_node_modules:
  api_node_modules:
  config_node_modules:
  constants_node_modules:
  schemas_node_modules:
  utils_node_modules:
  turbo_cache:
  next_cache:
  expo_cache:
  postgres_data:
